<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 16 and 32 px variant of AppIcon.svg: thicker arcs, larger light, no highlight. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24272f"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64) scale(8.96)">
    <rect width="100" height="100" rx="22.5" fill="url(#bg)"/>
    <g fill="none" stroke-width="11" transform="rotate(-80 50 50)">
      <circle cx="50" cy="50" r="28" stroke="#b98ad6" stroke-dasharray="49 9.6"/>
      <circle cx="50" cy="50" r="28" stroke="#5aaee8" stroke-dasharray="0 58.6 49 200"/>
      <circle cx="50" cy="50" r="28" stroke="#e9a21a" stroke-dasharray="0 117.2 49 200"/>
    </g>
    <circle cx="50" cy="50" r="13" fill="#1fb386"/>
  </g>
</svg>
